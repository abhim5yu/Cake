name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx cap add android

      - name: Force cake icon
        run: |
          pip install --break-system-packages pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          res = "android/app/src/main/res"
          sizes = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
          icon = Image.open("assets/icon-only.png").convert("RGBA")
          fg = Image.open("assets/icon-foreground.png").convert("RGBA")
          for d, (leg, ad) in sizes.items():
              p = f"{res}/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              sq = icon.resize((leg, leg), Image.LANCZOS)
              sq.save(f"{p}/ic_launcher.png")
              m = Image.new("L", (leg * 4, leg * 4), 0)
              ImageDraw.Draw(m).ellipse([0, 0, leg * 4 - 1, leg * 4 - 1], fill=255)
              m = m.resize((leg, leg), Image.LANCZOS)
              rd = Image.new("RGBA", (leg, leg), (0, 0, 0, 0))
              rd.paste(sq, (0, 0), m)
              rd.save(f"{p}/ic_launcher_round.png")
              fg.resize((ad, ad), Image.LANCZOS).save(f"{p}/ic_launcher_foreground.png")
          os.makedirs(f"{res}/mipmap-anydpi-v26", exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/cake_icon_bg"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(f"{res}/mipmap-anydpi-v26/{n}", "w").write(xml)
          os.makedirs(f"{res}/values", exist_ok=True)
          open(f"{res}/values/cake_icon_bg.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="cake_icon_bg">#0D0E10</color>\n</resources>\n')
          PY
          find android/app/src/main/res -name "ic_launcher*" -o -name "cake_icon_bg*" | sort

      - name: Add home-screen widgets
        run: |
          set -e
          APP=android/app/src/main
          JAVA_DIR=$APP/java/com/abhim5yu/cake
          mkdir -p "$JAVA_DIR/widgets"
          # MainActivity lives in the app's root package; everything else is in .widgets.
          cp widget-src/java/MainActivity.java "$JAVA_DIR/MainActivity.java"
          for f in widget-src/java/*.java; do
            n=$(basename "$f")
            [ "$n" = "MainActivity.java" ] || cp "$f" "$JAVA_DIR/widgets/$n"
          done
          cp -r widget-src/res/. "$APP/res/"
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "SmallWidgetProvider" not in s:
              snippet = open("widget-src/manifest_widgets.xml", encoding="utf-8").read()
              s = s.replace("</application>", snippet + "\n    </application>", 1)
              open(p, "w", encoding="utf-8").write(s)
          PY
          test -f "$JAVA_DIR/widgets/SmallWidgetProvider.java"
          grep -q "SmallWidgetProvider" "$APP/AndroidManifest.xml"

      - name: Dark launch screen
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i 's|@drawable/splash|#0D0E10|' "$f"
          grep -n "0D0E10" "$f"

      - name: Sync web assets
        run: npx cap sync android

      - name: Set up release signing
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Missing one or more release signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CAKE_KS=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "CAKE_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "CAKE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CAKE_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          if "CAKE_KS" not in s:
              signing = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CAKE_KS"))
                      storePassword System.getenv("CAKE_KS_PASS")
                      keyAlias System.getenv("CAKE_KEY_ALIAS")
                      keyPassword System.getenv("CAKE_KEY_PASS")
                  }
              }
              '''
              s = s.replace("android {", "android {\n" + signing, 1)
              # Sign debug builds with the release key too, so the APK we publish is the one that updates.
              s = s.replace("buildTypes {", "buildTypes {\n        debug { signingConfig signingConfigs.release }", 1)
              open(p, "w", encoding="utf-8").write(s)
          PY
          grep -q "CAKE_KS" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK is signed with the release key
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          KS=$(keytool -list -v -keystore "$CAKE_KS" -storepass "$CAKE_KS_PASS" -alias "$CAKE_KEY_ALIAS" 2>/dev/null \
               | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ': ' | tr 'A-F' 'a-f')
          APKSIG=$("$BT/apksigner" verify --print-certs "$APK" \
               | grep "certificate SHA-256" | head -1 | sed 's/.*digest: //' | tr -d ': ' | tr 'A-F' 'a-f')
          echo "Release key fingerprint: $KS"
          echo "APK fingerprint:         $APKSIG"
          if [ -z "$KS" ] || [ "$KS" != "$APKSIG" ]; then
            echo "MISMATCH: APK is not signed with the release key. Not publishing."
            exit 1
          fi
          echo "OK: APK is signed with the release key."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cake-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cake build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
