:root{color-scheme:dark;--bg:#0D0E10;--surface:#16181C;--soft:#222427;--ink:#F2F0EC;--muted:#9A9892;--line:rgba(255,255,255,.08);--acc:#D7EB6E;--danger:#F29A8E;--s1:8px;--s2:16px;--s3:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Plus Jakarta Sans",Inter,system-ui,sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:root{padding-top:env(safe-area-inset-top,0px)}
main{max-width:520px;margin:0 auto;padding:var(--s2) var(--s2) calc(120px + env(safe-area-inset-bottom,0px))}
.scr{display:none}.scr.on{display:block}
.top{margin:12px 0 var(--s3)}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.top p{margin:4px 0 0;color:var(--muted);font-size:15px}
.sec{display:flex;justify-content:space-between;margin:var(--s3) 4px var(--s1);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.btn{min-height:48px;padding:0 var(--s2);border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.full{width:100%}.btn.line{background:none;color:var(--ink);border:1px solid rgba(255,255,255,.16);font-weight:600}
.btn.danger{background:none;color:var(--danger);border:1px solid rgba(242,154,142,.4);font-weight:600}
.btn:active{opacity:.85}
.hero{position:relative;overflow:hidden;isolation:isolate;min-height:420px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;background:#0D0D0D;color:#fff;border:1px solid var(--line)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero-ph{display:grid;place-items:center;padding-bottom:170px;font-size:160px;font-weight:800;letter-spacing:-.05em;opacity:1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,transparent 0%,transparent 55%,#0D0D0D 100%)}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.eyebrow{padding:7px 14px;border-radius:999px;background:rgba(13,13,13,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.hedit{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(13,13,13,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;display:grid;place-items:center;padding:0;margin:-6px -6px 0 0}
.hbot{display:flex;flex-direction:column;gap:6px}
.hname{margin:0 0 6px;font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.05;color:#fff;overflow-wrap:anywhere}
.lock{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.8);margin-bottom:6px}
.lock span{font-size:18px;font-weight:500}.lock b{font-size:22px;font-weight:700;letter-spacing:-.02em;color:#fff}
.hero .btn{background:#F5F5F5;color:#0D0D0D;font-size:17px;min-height:54px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.hero .btn:active{background:#DCDCDC;opacity:1}
.list{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:14px 2px;min-height:72px;border-top:1px solid var(--line);cursor:pointer}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;border:1px solid rgba(255,255,255,.1);overflow:hidden;background:var(--soft)}
.av img{width:100%;height:100%;object-fit:cover}
.t1{background:rgba(154,223,192,.16);color:#9ADFC0;border-color:rgba(154,223,192,.4)}
.t2{background:rgba(183,169,240,.16);color:#B7A9F0;border-color:rgba(183,169,240,.4)}
.t3{background:rgba(246,183,154,.16);color:#F6B79A;border-color:rgba(246,183,154,.4)}
.t4{background:rgba(142,201,242,.16);color:#8EC9F2;border-color:rgba(142,201,242,.4)}
.t5{background:rgba(242,222,138,.16);color:#F2DE8A;border-color:rgba(242,222,138,.4)}
.hero-ph.t1{background:#1D2F29}.hero-ph.t2{background:#27233F}.hero-ph.t3{background:#3A2A22}.hero-ph.t4{background:#1C2D3A}.hero-ph.t5{background:#38331C}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mid span{font-size:14px;color:var(--muted)}
.dt{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;letter-spacing:.03em;text-align:right;min-width:56px}
.ib{width:44px;height:44px;flex:none;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:transparent;color:rgba(242,240,236,.7);display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
@media (hover:hover){.ib:hover{background:rgba(255,255,255,.08);color:#fff}}
.ib:active{background:rgba(255,255,255,.14);color:#fff}
.ib-sp{width:44px;flex:none}
.empty{padding:40px 24px;text-align:center;border:1px dashed rgba(255,255,255,.16);border-radius:20px}
.empty h2{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.03em}.empty p{margin:0 0 20px;color:var(--muted)}
.cal{padding:var(--s2)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.ch b{font-size:18px;font-weight:700;letter-spacing:.02em}
.nb{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);font-size:22px;padding:0}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg i{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0 8px}
.dc{aspect-ratio:1;min-height:44px;border:0;border-radius:12px;background:none;color:var(--ink);font-size:15px;display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.dc.past{color:var(--muted)}
.dc.ev{background:var(--acc);color:#11130C;font-weight:700}
.dc.now{outline:2px solid var(--ink);outline-offset:-2px}
.dc.sel{background:var(--ink);color:var(--bg);font-weight:700}
.dc.sel.ev{background:var(--acc);box-shadow:inset 0 0 0 2px #11130C}
.detail{padding:4px 16px 16px;display:flex;flex-direction:column}
.detail .row:first-child{border-top:0}
.detail .none{color:var(--muted);padding:12px 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:40px max(24px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));background:linear-gradient(to top,#0D0E10 65%,transparent);pointer-events:none;z-index:10}
.nav>*{pointer-events:auto}
.pill,.plus{background:rgba(20,21,22,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border:0}
.pill{display:flex;gap:4px;padding:5px;border-radius:999px}
.tab{min-height:46px;min-width:84px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--muted);font-weight:600}
.tab.on{background:var(--ink);color:var(--bg)}
.plus{width:58px;height:58px;border-radius:50%;color:#F5F5F5;font-size:28px;padding:0}
.plus:active{background:rgba(255,255,255,.12)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}.ov.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--muted);opacity:.4;margin:0 auto 16px}
.sheet h3{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.03em}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px 4px}
input,select,textarea{width:100%;min-height:48px;padding:0 16px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px}
textarea{padding:12px 16px;border-radius:16px;min-height:96px;resize:none}
.g{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:8px}
.sheet .btn{margin-top:var(--s2)}.sheet .btn+.btn{margin-top:8px}
.ph{display:flex;align-items:center;gap:12px;margin-top:var(--s2)}.ph .av{width:56px;height:56px}.ph .btn{margin:0;flex:1}
.err{min-height:20px;margin-top:12px;font-size:14px;color:var(--danger)}
.note{min-height:20px;margin-top:12px;font-size:14px;color:var(--muted)}
.conf{display:none;margin-top:var(--s2);padding:14px;border:1px solid rgba(242,154,142,.4);border-radius:16px}.conf.on{display:block}
.conf p{margin:0 0 4px}
.conf .r{display:grid;grid-template-columns:1fr 1fr;gap:8px}.conf .btn{margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main>
<section class="scr on" id="s-home"><header class="top"><h1>Hey there</h1><p>Who’s celebrating next?</p></header><div id="home"></div></section>
<section class="scr" id="s-cal"><header class="top"><h1>Calendar</h1><p>Tap a day to see who’s on it</p></header>
 <div class="card cal"><div class="ch"><button class="nb" id="pm" aria-label="Previous month">‹</button><b id="mt"></b><button class="nb" id="nm" aria-label="Next month">›</button></div><div class="cg" id="cg"></div></div>
 <div class="sec"><span id="sd"></span></div><div class="card detail" id="dt"></div></section>
</main>
<nav class="nav"><div class="pill"><button class="tab on" data-s="home">Home</button><button class="tab" data-s="cal">Calendar</button></div><button class="plus" id="add" aria-label="Add a birthday">+</button></nav>

<div class="ov" id="ovF"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ft">
 <h3 id="ft">New birthday</h3>
 <label for="fn">Name</label><input id="fn" autocomplete="off" maxlength="40">
 <div class="g"><div><label for="fm">Month</label><select id="fm"></select></div><div><label for="fd">Day</label><select id="fd"></select></div><div><label for="fy">Year</label><input id="fy" placeholder="Optional" inputmode="numeric" maxlength="4"></div></div>
 <label for="fp">Phone (optional)</label><input id="fp" type="tel" placeholder="+91 98765 43210" autocomplete="off">
 <div class="ph"><div class="av" id="fpv"></div><button class="btn line" id="fpb" type="button">Add photo</button><button class="btn line" id="fpr" type="button" style="display:none">Remove</button></div>
 <input id="ff" type="file" accept="image/*" style="display:none">
 <div class="err" id="fe" role="alert"></div>
 <button class="btn full" id="fs" type="button">Save</button>
 <button class="btn line full" id="fc" type="button">Cancel</button>
 <button class="btn danger full" id="fdl" type="button" style="display:none">Delete</button>
 <div class="conf" id="cf"><p id="cft"></p><div class="r"><button class="btn line" id="cfn" type="button">Keep</button><button class="btn danger" id="cfy" type="button">Delete</button></div></div>
</div></div>

<div class="ov" id="ovW"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wt">
 <h3 id="wt">Send wishes</h3><div class="note" id="wto"></div>
 <label for="wm">Message</label><textarea id="wm"></textarea>
 <button class="btn full" data-ch="wa" type="button">WhatsApp</button>
 <button class="btn line full" data-ch="sms" type="button">SMS</button>
 <div class="note" id="wd"></div>
</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"],
    MONL=["January","February","March","April","May","June","July","August","September","October","November","December"],
    KEY="cake.v1",
    PLANE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>',
    CHAT='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.7 7.1L3 21l1.9-5.9A8 8 0 1 1 21 12z"/></svg>',
    EDIT='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return("0"+n).slice(-2)}
function leap(y){return y%4===0&&(y%100!==0||y%400===0)}
function maxDay(m,y){return[31,leap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1]}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function valid(p){return p&&typeof p.id==="string"&&typeof p.name==="string"&&p.name&&p.month>=1&&p.month<=12&&p.day>=1&&p.day<=maxDay(p.month,2000)}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d.filter(valid):[]}catch(e){return[]}}
var P=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));return true}catch(e){return false}}
function occ(p,t){var y=t.getFullYear();function mk(y){var d=p.day;if(p.month===2&&d===29&&!leap(y))d=28;return new Date(y,p.month-1,d)}
 var d=mk(y);if(d<t){y++;d=mk(y)}return{date:d,days:Math.round((d-t)/864e5),year:y}}
function enrich(t){return P.map(function(p){var o=occ(p,t);return{p:p,days:o.days,date:o.date,turns:p.year?o.year-p.year:null}})
 .sort(function(a,b){return a.days-b.days||a.p.name.localeCompare(b.p.name)})}
function dl(e){return pad(e.date.getDate())+" "+MON[e.date.getMonth()]}
function rel(n){return n===0?"Today":n===1?"Tomorrow":"in "+n+" days"}
function ini(n){var w=n.trim().split(/\s+/);return((w[0]||"?")[0]+(w.length>1?w[w.length-1][0]:"")).toUpperCase()}
function tint(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return h%5+1}
function av(p){return p.photo?'<div class="av"><img alt="" src="'+p.photo+'"></div>':'<div class="av t'+tint(p.name)+'">'+esc(ini(p.name))+'</div>'}
function heroHtml(e){var p=e.p,eb=(e.days===0?"Today":e.days===1?"Tomorrow":"In "+e.days+" days")+" • "+dl(e),
 bg=p.photo?'<img class="hero-img" alt="" src="'+p.photo+'">':'<div class="hero-img hero-ph t'+tint(p.name)+'" aria-hidden="true">'+esc(ini(p.name))+'</div>';
 return '<div class="card hero">'+bg+'<div class="htop"><span class="eyebrow">'+eb+'</span><button class="hedit" data-edit="'+p.id+'" aria-label="Edit '+esc(p.name)+'">'+EDIT+'</button></div>'+
 '<div class="hbot"><h2 class="hname">'+esc(p.name)+'</h2>'+(e.turns!==null&&e.turns>0?'<div class="lock"><span>turns</span><b>'+e.turns+'</b></div>':'')+
 '<button class="btn full" data-wish="'+p.id+'">'+CHAT+'Send wishes</button></div></div>'}
function rowHtml(e,btn){var p=e.p;return '<div class="row" data-edit="'+p.id+'" tabindex="0" role="button" aria-label="Edit '+esc(p.name)+'">'+av(p)+
 '<div class="mid"><b>'+esc(p.name)+'</b><span>'+rel(e.days)+(e.turns!==null&&e.turns>0?" · turns "+e.turns:"")+'</span></div><time class="dt">'+dl(e)+'</time>'+
 (btn?'<button class="ib" data-wish="'+p.id+'" aria-label="Send wishes to '+esc(p.name)+'">'+PLANE+'</button>':'<span class="ib-sp"></span>')+'</div>'}
function sec(title,arr,btn){return arr.length?'<div class="sec"><span>'+title+'</span><span>'+arr.length+'</span></div><div class="list">'+arr.map(function(e){return rowHtml(e,btn)}).join("")+'</div>':""}
function renderHome(){var t=today(),L=enrich(t),h=$("home");
 if(!L.length){h.innerHTML='<div class="empty"><h2>No birthdays yet</h2><p>Add the first one and it shows up here.</p><button class="btn" data-add="">Add a birthday</button></div>';return}
 var rest=L.slice(1),tm=[],wk=[],mo=[],lt=[];
 rest.forEach(function(e){if(e.days===0)tm.push(e);else if(e.days<=7)wk.push(e);else if(e.date.getMonth()===t.getMonth()&&e.date.getFullYear()===t.getFullYear())mo.push(e);else lt.push(e)});
 h.innerHTML=heroHtml(L[0])+sec("TODAY",tm,true)+sec("THIS WEEK",wk,true)+sec("THIS MONTH",mo,true)+sec("LATER",lt,false)}
var cy,cm,cd;
function resetCal(){var t=today();cy=t.getFullYear();cm=t.getMonth();cd=t.getDate()}resetCal();
function on(y,m,d){return P.filter(function(p){return p.month===m&&(p.day===d||(m===2&&p.day===29&&d===28&&!leap(y)))})}
function renderCal(){var t=today(),n=new Date(cy,cm+1,0).getDate(),first=new Date(cy,cm,1).getDay(),h="";
 $("mt").textContent=MONL[cm].toUpperCase()+" "+cy;
 "SMTWTFS".split("").forEach(function(c){h+="<i>"+c+"</i>"});
 for(var i=0;i<first;i++)h+='<span></span>';
 for(var d=1;d<=n;d++){var dt=new Date(cy,cm,d),c="dc";if(on(cy,cm+1,d).length)c+=" ev";if(dt<t)c+=" past";if(+dt===+t)c+=" now";if(d===cd)c+=" sel";
  h+='<button class="'+c+'" data-d="'+d+'" aria-label="'+d+' '+MONL[cm]+'">'+d+'</button>'}
 $("cg").innerHTML=h;
 $("sd").textContent=pad(cd)+" "+MON[cm]+" "+cy;
 var L=on(cy,cm+1,cd),sel=new Date(cy,cm,cd),d2=$("dt");
 if(!L.length){d2.innerHTML='<div class="none">Nothing on this day.</div><button class="btn line full" data-add="'+(cm+1)+'-'+cd+'" style="margin-top:4px">Add a birthday</button>';return}
 d2.innerHTML=L.map(function(p){var age=p.year?cy-p.year:null;
  return '<div class="row" data-edit="'+p.id+'" tabindex="0" role="button" aria-label="Edit '+esc(p.name)+'">'+av(p)+'<div class="mid"><b>'+esc(p.name)+'</b><span>'+(age>0?"turns "+age:"Birthday")+'</span></div>'+
  (sel>=t?'<button class="ib" data-wish="'+p.id+'" aria-label="Send wishes to '+esc(p.name)+'">'+PLANE+'</button>':'<span class="ib-sp"></span>')+'</div>'}).join("")}
function render(){renderHome();renderCal()}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},2400)}
function openOv(id){$(id).classList.add("on");history.pushState({s:1},"")}
function closeOv(){if(history.state&&history.state.s)history.back();else hideOv()}
function hideOv(){[].forEach.call(document.querySelectorAll(".ov.on"),function(o){o.classList.remove("on")})}
window.addEventListener("popstate",hideOv);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&document.querySelector(".ov.on"))closeOv()});
["ovF","ovW"].forEach(function(id){$(id).addEventListener("click",function(e){if(e.target===$(id))closeOv()})});
function byId(id){for(var i=0;i<P.length;i++)if(P[i].id===id)return P[i];return null}
var editId=null,photo=null;
(function(){var m=$("fm"),h="";for(var i=0;i<12;i++)h+='<option value="'+(i+1)+'">'+MON[i]+'</option>';m.innerHTML=h})();
function fillDays(keep){var m=+$("fm").value,y=+$("fy").value,mx=maxDay(m,/^\d{4}$/.test($("fy").value)?y:2000),h="";
 for(var i=1;i<=mx;i++)h+='<option value="'+i+'">'+pad(i)+'</option>';$("fd").innerHTML=h;$("fd").value=Math.min(keep||1,mx)}
$("fm").onchange=function(){fillDays(+$("fd").value)};
$("fy").oninput=function(){this.value=this.value.replace(/\D/g,"");fillDays(+$("fd").value)};
function setPhoto(src){photo=src||null;var v=$("fpv"),n=$("fn").value.trim()||"?";
 v.className="av"+(photo?"":" t"+tint(n));v.innerHTML=photo?'<img alt="" src="'+photo+'">':esc(ini(n));
 $("fpb").textContent=photo?"Change photo":"Add photo";$("fpr").style.display=photo?"":"none"}
$("fn").oninput=function(){if(!photo)setPhoto(null)};
function openForm(id,pre){editId=id||null;var p=id?byId(id):null,t=today();$("fe").textContent="";$("cf").classList.remove("on");
 $("ft").textContent=p?"Edit birthday":"New birthday";$("fdl").style.display=p?"":"none";
 $("fn").value=p?p.name:"";$("fy").value=p&&p.year?p.year:"";$("fp").value=p&&p.phone?p.phone:"";
 var m=p?p.month:(pre&&pre.indexOf("-")>0?+pre.split("-")[0]:t.getMonth()+1),d=p?p.day:(pre&&pre.indexOf("-")>0?+pre.split("-")[1]:t.getDate());
 $("fm").value=m;fillDays(d);setPhoto(p?p.photo:null);openOv("ovF")}
$("add").onclick=function(){openForm(null)};
$("fc").onclick=closeOv;
$("fpb").onclick=function(){$("ff").click()};
$("fpr").onclick=function(){setPhoto(null)};
$("ff").onchange=function(){var f=this.files&&this.files[0];this.value="";if(!f)return;
 var r=new FileReader();r.onerror=function(){$("fe").textContent="Could not read that photo."};
 r.onload=function(){var im=new Image();im.onerror=function(){$("fe").textContent="That file is not a usable image."};
  im.onload=function(){var s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
   c.getContext("2d").drawImage(im,0,0,c.width,c.height);$("fe").textContent="";setPhoto(c.toDataURL("image/jpeg",.82))};im.src=r.result};r.readAsDataURL(f)};
$("fs").onclick=function(){var name=$("fn").value.trim(),m=+$("fm").value,d=+$("fd").value,ys=$("fy").value.trim(),ph=$("fp").value.trim(),e=$("fe"),y=null,cur=new Date().getFullYear();
 if(!name){e.textContent="Enter a name.";$("fn").focus();return}
 if(ys){y=+ys;if(!/^\d{4}$/.test(ys)||y<1900||y>cur){e.textContent="Year must be 4 digits, 1900 to "+cur+".";return}if(d>maxDay(m,y)){e.textContent="That date does not exist in "+y+".";return}}
 if(ph&&!/^\+?[\d\s\-()]{5,20}$/.test(ph)){e.textContent="Phone: digits, spaces, + - ( ) only.";return}
 var rec={id:editId||(Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name:name,month:m,day:d};
 if(y)rec.year=y;if(ph)rec.phone=ph;if(photo)rec.photo=photo;
 var old=P.slice();
 if(editId)P=P.map(function(p){return p.id===editId?rec:p});else P.push(rec);
 if(!save()){P=old;e.textContent="Could not save. Storage may be full. Try a smaller photo or remove one.";return}
 closeOv();render();toast("Saved")};
$("fdl").onclick=function(){var p=byId(editId);if(!p)return;$("cft").textContent="Delete "+p.name+"? This cannot be undone.";$("cf").classList.add("on");$("fdl").style.display="none"};
$("cfn").onclick=function(){$("cf").classList.remove("on");$("fdl").style.display=""};
$("cfy").onclick=function(){var old=P.slice();P=P.filter(function(p){return p.id!==editId});
 if(!save()){P=old;$("fe").textContent="Could not delete. Storage error.";$("cf").classList.remove("on");$("fdl").style.display="";return}
 closeOv();render();toast("Deleted")};
var wp=null;
function openWish(id){var p=byId(id);if(!p)return;wp=p;$("wm").value="Happy birthday, "+p.name+"! Wishing you a wonderful year ahead. 🎂";
 $("wto").textContent=p.phone?"To: "+p.name+" · "+p.phone:"No number saved. You pick the contact in the app.";$("wd").textContent="";openOv("ovW")}
document.querySelectorAll("[data-ch]").forEach(function(b){b.onclick=function(){if(!wp)return;var msg=encodeURIComponent($("wm").value),num=(wp.phone||"").replace(/[^\d+]/g,""),url;
 if(b.dataset.ch==="wa"){url="https://wa.me/"+num.replace(/\D/g,"")+"?text="+msg}else{url="sms:"+num+"?body="+msg}
 $("wd").textContent="Opening "+(b.dataset.ch==="wa"?"WhatsApp":"SMS")+"…";location.href=url}});
document.addEventListener("click",function(e){var w=e.target.closest("[data-wish]");if(w){e.stopPropagation();openWish(w.dataset.wish);return}
 var ed=e.target.closest("[data-edit]");if(ed){openForm(ed.dataset.edit);return}
 var ad=e.target.closest("[data-add]");if(ad){openForm(null,ad.getAttribute("data-add"))}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("row"))openForm(e.target.dataset.edit)});
$("cg").onclick=function(e){var b=e.target.closest("[data-d]");if(b){cd=+b.dataset.d;renderCal()}};
function mv(n){cm+=n;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}var t=today();cd=(cy===t.getFullYear()&&cm===t.getMonth())?t.getDate():1;renderCal()}
$("pm").onclick=function(){mv(-1)};$("nm").onclick=function(){mv(1)};
[].forEach.call(document.querySelectorAll(".tab"),function(t){t.onclick=function(){[].forEach.call(document.querySelectorAll(".tab"),function(x){x.classList.toggle("on",x===t)});
 [].forEach.call(document.querySelectorAll(".scr"),function(s){s.classList.toggle("on",s.id==="s-"+t.dataset.s)});if(t.dataset.s==="cal"){resetCal();renderCal()}scrollTo(0,0)}});
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
render();
})();
</script></body></html>
